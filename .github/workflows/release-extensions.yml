name: Release Chrome Extensions

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check all packages
        run: pnpm compile:all

      - name: Build and zip all extensions
        run: pnpm zip:all

      - name: Collect and normalize ZIP filenames
        run: |
          mkdir -p release-assets
          for dir in apps/ext-*; do
            name=$(basename "$dir")
            if [ "$name" = "ext-template" ]; then
              continue
            fi
            zip_file=$(ls "$dir"/.output/*-chrome.zip 2>/dev/null | head -n 1)
            if [ -n "$zip_file" ]; then
              cp "$zip_file" "release-assets/100free-${name}-chrome.zip"
              echo "Packaged: 100free-${name}-chrome.zip"
            fi
          done
          ls -lh release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 100-Free Extensions ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*.zip
