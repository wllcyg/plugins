<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 背景渐变：从活力天蓝到深邃靛蓝 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- 镜头反光渐变 -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- 展开长截图纸带渐变 -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.8" />
    </linearGradient>

    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 1. 背景圆角矩形 -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- 2. 四角截屏定位取景框 Reticle (增强截图与裁切的专业感) -->
  <path d="M 22 36 L 22 24 L 34 24" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 106 36 L 106 24 L 94 24" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 22 92 L 22 104 L 34 104" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 106 92 L 106 104 L 94 104" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 3. 纵向长截图展开纸卷 / 网页视口 (体现 Long Screenshot 滚动特性) -->
  <rect x="36" y="24" width="56" height="76" rx="6" fill="url(#paperGrad)" />
  <!-- 纸带上的网页骨架条 (代表长页面) -->
  <rect x="42" y="32" width="24" height="4" rx="2" fill="#cbd5e1" />
  <rect x="42" y="40" width="44" height="3" rx="1.5" fill="#e2e8f0" />
  <rect x="42" y="46" width="38" height="3" rx="1.5" fill="#e2e8f0" />
  <!-- 滚动下箭头 (直观表达向下滑动长截图) -->
  <path d="M 64 68 L 64 88 M 58 82 L 64 88 L 70 82" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 4. 前置相机核心徽标 (漂浮在左上方，融合相机与长图) -->
  <g transform="translate(42, 48)">
    <rect x="0" y="4" width="44" height="30" rx="6" fill="#0f172a" fill-opacity="0.88" />
    <path d="M 12 4 L 15 0 L 29 0 L 32 4 Z" fill="#0f172a" fill-opacity="0.88" />
    <!-- 闪光灯 -->
    <circle cx="9" cy="11" r="2" fill="#38bdf8" />
    <!-- 镜头外圈 -->
    <circle cx="22" cy="19" r="10" fill="#ffffff" fill-opacity="0.2" />
    <!-- 镜头内圈光圈 -->
    <circle cx="22" cy="19" r="7.5" fill="url(#lensGrad)" />
    <!-- 镜头反光高光 -->
    <ellipse cx="20" cy="17" rx="2.5" ry="1.5" fill="#ffffff" fill-opacity="0.75" />
  </g>

  <!-- 5. 2x 超清闪烁星芒 (Sparkle) 右下角点缀 -->
  <path d="M 96 82 Q 96 90 104 90 Q 96 90 96 98 Q 96 90 88 90 Q 96 90 96 82 Z" fill="#fbbf24" />
</svg>
