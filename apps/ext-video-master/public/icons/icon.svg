<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)" filter="url(#shadow)" />

  <!-- 播放三角形 -->
  <path d="M48 38 L92 64 L48 90 Z" fill="#ffffff" opacity="0.95" />

  <!-- 闪电超速标志 -->
  <path d="M72 32 L56 62 L74 62 L58 96 L88 56 L70 56 Z" fill="url(#bolt)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />
</svg>
