<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- 背景圆角矩形 -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#0F172A" />
  <rect x="8" y="8" width="112" height="112" rx="28" fill="none" stroke="url(#qrGrad)" stroke-width="2.5" opacity="0.6"/>

  <!-- 左上角定位符 -->
  <rect x="24" y="24" width="32" height="32" rx="8" fill="none" stroke="url(#qrGrad)" stroke-width="5" />
  <rect x="33" y="33" width="14" height="14" rx="4" fill="url(#qrGrad)" />

  <!-- 右上角定位符 -->
  <rect x="72" y="24" width="32" height="32" rx="8" fill="none" stroke="url(#qrGrad)" stroke-width="5" />
  <rect x="81" y="33" width="14" height="14" rx="4" fill="url(#qrGrad)" />

  <!-- 左下角定位符 -->
  <rect x="24" y="72" width="32" height="32" rx="8" fill="none" stroke="url(#qrGrad)" stroke-width="5" />
  <rect x="33" y="81" width="14" height="14" rx="4" fill="url(#qrGrad)" />

  <!-- 艺术点阵与扫描射线 -->
  <circle cx="64" cy="40" r="4.5" fill="#38BDF8" />
  <circle cx="64" cy="56" r="4.5" fill="#34D399" />
  <circle cx="72" cy="72" r="4.5" fill="#10B981" />
  <circle cx="88" cy="72" r="4.5" fill="#06B6D4" />
  <circle cx="104" cy="72" r="4.5" fill="#38BDF8" />
  <circle cx="72" cy="88" r="4.5" fill="#34D399" />
  <circle cx="88" cy="88" r="5.5" fill="#10B981" />
  <circle cx="104" cy="88" r="4.5" fill="#06B6D4" />
  <circle cx="72" cy="104" r="4.5" fill="#059669" />
  <circle cx="88" cy="104" r="4.5" fill="#10B981" />

  <!-- 闪电/极速扫描标识 -->
  <path d="M60 74 L52 88 L59 88 L55 102 L68 86 L61 86 Z" fill="#FBBF24" filter="url(#glow)"/>
</svg>
